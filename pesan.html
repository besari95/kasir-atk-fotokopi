<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan - ATK & Fotokopi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <div class="bg-violet-600 text-white px-4 py-4 text-center">
        <h1 class="font-bold text-lg" id="namaToko">ATK & Fotokopi</h1>
        <p class="text-sm opacity-90">Pilih barang sendiri lalu bayar via QRIS / Transfer</p>
    </div>

    <div class="max-w-lg mx-auto p-4">

        <!-- Daftar Produk -->
        <div id="daftarProduk" class="grid grid-cols-2 gap-3 mb-6">
            <!-- produk muncul di sini -->
        </div>

        <!-- Keranjang -->
        <div class="bg-white rounded-xl shadow p-4 mb-4">
            <h2 class="font-bold mb-3">Pesanan Kamu</h2>
            <div id="keranjang" class="space-y-2 text-sm">
                <p class="text-gray-400 text-center py-4">Belum ada item</p>
            </div>
            <div class="border-t mt-3 pt-3 flex justify-between font-bold">
                <span>Total</span>
                <span id="totalBelanja">Rp 0</span>
            </div>
        </div>

        <!-- Tombol Bayar -->
        <button id="btnBayar" onclick="tampilkanPembayaran()"
            class="w-full bg-violet-600 text-white font-bold py-3 rounded-xl disabled:opacity-50" disabled>
            Lanjut ke Pembayaran
        </button>
    </div>

    <!-- Modal Pembayaran -->
    <div id="modalBayar" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm">
            <h2 class="font-bold text-lg text-center mb-1">Pembayaran</h2>
            <p class="text-center text-sm text-gray-500 mb-4">Total: <span id="totalBayar"
                    class="font-bold text-violet-600"></span></p>

            <!-- QRIS -->
            <div class="text-center mb-5">
                <p class="text-sm font-medium mb-2">Scan QRIS</p>
                <img src="qris.png" alt="QRIS" class="mx-auto w-48 h-48 object-contain border rounded-lg">
            </div>

            <!-- Transfer -->
            <div class="bg-violet-50 rounded-xl p-4 text-sm mb-5">
                <p class="font-medium mb-1">Transfer Bank BRI</p>
                <p>No. Rek: <b>582401006690509</b></p>
                <p>a.n. <b>Amat Besari</b></p>
            </div>

            <p class="text-xs text-center text-gray-500 mb-4">
                Setelah transfer, silakan konfirmasi ke kasir / WhatsApp toko.
            </p>

            <button onclick="tutupModalBayar()" class="w-full border rounded-xl py-2.5">Tutup</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        let semuaProduk = []
        let keranjang = []

        const daftarProduk = document.getElementById('daftarProduk')
        const keranjangEl = document.getElementById('keranjang')
        const totalBelanjaEl = document.getElementById('totalBelanja')
        const btnBayar = document.getElementById('btnBayar')
        const modalBayar = document.getElementById('modalBayar')

        // Nama toko
        document.getElementById('namaToko').textContent = localStorage.getItem('namaToko') || 'ATK & Fotokopi'

        async function loadProduk() {
            const { data, error } = await supabase.from('produk').select('*').order('nama')
            if (error) {
                alert('Gagal memuat produk')
                return
            }
            semuaProduk = data
            tampilkanProduk(data)
        }

        function tampilkanProduk(data) {
            daftarProduk.innerHTML = ''
            data.forEach(p => {
                const div = document.createElement('div')
                div.className = 'bg-white rounded-xl p-3 shadow-sm border'
                div.innerHTML = `
          <div class="font-medium text-sm mb-1">${p.nama}</div>
          <div class="text-xs text-gray-500 mb-2">${p.kategori}</div>
          <div class="font-bold text-violet-600 text-sm mb-2">Rp ${p.harga_jual.toLocaleString('id-ID')}</div>
          <button onclick='tambah(${JSON.stringify(p).replace(/'/g, "&#39;")})' 
            class="w-full bg-violet-100 text-violet-700 text-xs py-1.5 rounded-lg hover:bg-violet-200">
            + Tambah
          </button>
        `
                daftarProduk.appendChild(div)
            })
        }

        window.tambah = function (produk) {
            const ada = keranjang.find(i => i.id === produk.id)
            if (ada) {
                ada.qty++
            } else {
                keranjang.push({ ...produk, qty: 1, harga: produk.harga_jual })
            }
            renderKeranjang()
        }

        function renderKeranjang() {
            if (keranjang.length === 0) {
                keranjangEl.innerHTML = `<p class="text-gray-400 text-center py-4">Belum ada item</p>`
                totalBelanjaEl.textContent = 'Rp 0'
                btnBayar.disabled = true
                return
            }

            let total = 0
            keranjangEl.innerHTML = ''
            keranjang.forEach((item, idx) => {
                const sub = item.harga * item.qty
                total += sub
                keranjangEl.innerHTML += `
          <div class="flex justify-between items-center">
            <div>
              <div>${item.nama}</div>
              <div class="text-gray-500 text-xs">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="ubahQty(${idx}, -1)" class="w-6 h-6 bg-gray-200 rounded">-</button>
              <span>${item.qty}</span>
              <button onclick="ubahQty(${idx}, 1)" class="w-6 h-6 bg-gray-200 rounded">+</button>
            </div>
          </div>
        `
            })
            totalBelanjaEl.textContent = 'Rp ' + total.toLocaleString('id-ID')
            btnBayar.disabled = false
        }

        window.ubahQty = function (idx, perubahan) {
            keranjang[idx].qty += perubahan
            if (keranjang[idx].qty < 1) keranjang.splice(idx, 1)
            renderKeranjang()
        }

        window.tampilkanPembayaran = function () {
            const total = keranjang.reduce((s, i) => s + i.harga * i.qty, 0)
            document.getElementById('totalBayar').textContent = 'Rp ' + total.toLocaleString('id-ID')
            modalBayar.classList.remove('hidden')
            modalBayar.classList.add('flex')
        }

        window.tutupModalBayar = function () {
            modalBayar.classList.add('hidden')
            modalBayar.classList.remove('flex')
        }

        loadProduk()
    </script>
</body>

</html>
