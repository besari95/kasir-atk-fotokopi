<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - Kasir ATK & Fotokopi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center shadow">
        <div class="font-bold text-lg">Kasir ATK & Fotokopi</div>
        <div class="space-x-4 text-sm">
            <a href="kasir.html" class="hover:underline">Kasir</a>
            <a href="produk.html" class="font-bold underline">Produk</a>
            <a href="laporan.html" class="hover:underline">Laporan</a>
            <a href="pengaturan.html" class="hover:underline">Pengaturan</a>
            <a href="index.html" class="hover:underline">Keluar</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Kelola Produk</h1>
            <button onclick="bukaModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">
                + Tambah Produk
            </button>
        </div>

        <!-- Tabel Produk -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="px-4 py-3 text-left">Nama</th>
                        <th class="px-4 py-3 text-left">Kategori</th>
                        <th class="px-4 py-3 text-right">Harga Jual</th>
                        <th class="px-4 py-3 text-right">Stok</th>
                        <th class="px-4 py-3 text-left">Satuan</th>
                        <th class="px-4 py-3 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelProduk">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Tambah/Edit -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <h2 id="judulModal" class="text-xl font-bold mb-4">Tambah Produk</h2>

            <form id="formProduk" class="space-y-4">
                <input type="hidden" id="produkId">

                <div>
                    <label class="block text-sm font-medium mb-1">Nama Produk / Jasa</label>
                    <input type="text" id="nama" required
                        class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Kategori</label>
                    <select id="kategori" required
                        class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ATK">ATK</option>
                        <option value="Fotokopi">Fotokopi</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Harga Jual</label>
                        <input type="number" id="harga_jual" required min="0"
                            class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Harga Modal</label>
                        <input type="number" id="harga_modal" min="0" value="0"
                            class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Stok</label>
                        <input type="number" id="stok" required min="0" value="0"
                            class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Satuan</label>
                        <select id="satuan"
                            class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="pcs">pcs</option>
                            <option value="lembar">lembar</option>
                            <option value="rim">rim</option>
                            <option value="pack">pack</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="tutupModal()"
                        class="flex-1 border rounded-lg py-2 hover:bg-gray-50">Batal</button>
                    <button type="submit"
                        class="flex-1 bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/produk.js"></script>
</body>

</html>
